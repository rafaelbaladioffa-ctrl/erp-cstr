server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Nginx não herda add_header de blocos pai quando o bloco filho também
    # define add_header — por isso os security headers são repetidos em cada
    # location para garantir que sempre apareçam na resposta.

    # Assets do build (JS/CSS) têm hash no nome — o navegador pode guardar
    # em cache por muito tempo, já que qualquer mudança de conteúdo gera um
    # nome de arquivo novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src *; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # index.html (e qualquer outra rota que caia nele via SPA fallback)
    # nunca pode ficar em cache — é ele que referencia o JS/CSS com hash
    # atual. Sem isso, o navegador pode continuar servindo uma versão
    # antiga da página (e do app) por horas sem buscar a nova.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src *; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
