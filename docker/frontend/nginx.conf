server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets do build (JS/CSS) têm hash no nome — o navegador pode guardar
    # em cache por muito tempo, já que qualquer mudança de conteúdo gera um
    # nome de arquivo novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html (e qualquer outra rota que caia nele via SPA fallback)
    # nunca pode ficar em cache — é ele que referencia o JS/CSS com hash
    # atual. Sem isso, o navegador pode continuar servindo uma versão
    # antiga da página (e do app) por horas sem buscar a nova.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
