server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Impede que o browser faça MIME-sniffing do tipo de conteúdo.
    add_header X-Content-Type-Options "nosniff" always;
    # Não permite que a aplicação seja embutida em <iframe> de outro domínio.
    add_header X-Frame-Options "DENY" always;
    # Não envia o caminho completo da URL no header Referer ao navegar para domínios externos.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Desabilita acesso a sensores/hardware não utilizados pela aplicação.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP: só permite recursos da própria origem + Google Fonts (ícones Material Symbols).
    # unsafe-inline em style-src é necessário para os estilos inline gerados pelo React em produção.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Assets do build (JS/CSS) têm hash no nome — o navegador pode guardar
    # em cache por muito tempo, já que qualquer mudança de conteúdo gera um
    # nome de arquivo novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html (e qualquer outra rota que caia nele via SPA fallback)
    # nunca pode ficar em cache — é ele que referencia o JS/CSS com hash
    # atual. Sem isso, o navegador pode continuar servindo uma versão
    # antiga da página (e do app) por horas sem buscar a nova.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
