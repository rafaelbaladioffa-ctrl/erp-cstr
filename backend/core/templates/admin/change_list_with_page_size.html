{% extends "admin/change_list.html" %}

{% block search %}
    {{ block.super }}
    <form method="get" class="flex items-center gap-2">
        {% for key, value in request.GET.items %}
            {% if key != "per_page" and key != "p" %}
                <input type="hidden" name="{{ key }}" value="{{ value }}">
            {% endif %}
        {% endfor %}
        <label for="page-size-selector" class="font-medium text-font-default-light text-sm dark:text-font-default-dark whitespace-nowrap">
            Por Página
        </label>
        <select id="page-size-selector" name="per_page" onchange="this.form.submit()" class="border border-base-200 bg-white font-medium min-w-20 px-3 py-2 rounded-default text-font-default-light text-sm dark:bg-base-900 dark:border-base-700 dark:text-font-default-dark">
            <option value="10"{% if cl.selected_page_size == "10" %} selected{% endif %}>10</option>
            <option value="50"{% if cl.selected_page_size == "50" %} selected{% endif %}>50</option>
            <option value="100"{% if cl.selected_page_size == "100" %} selected{% endif %}>100</option>
            <option value="all"{% if cl.selected_page_size == "all" %} selected{% endif %}>Todos</option>
        </select>
    </form>
{% endblock %}
