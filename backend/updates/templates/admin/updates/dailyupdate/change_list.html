{% extends "admin/change_list_with_page_size.html" %}

{% block object-tools-items %}
    {{ block.super }}
    <form method="get" action="{% url 'admin:updates_dailyupdate_consolidated_pdf' %}" target="_blank"
          class="flex items-center gap-2">
        <label for="pdf-date" class="font-medium text-sm whitespace-nowrap">Data do PDF</label>
        <input id="pdf-date" type="date" name="date" value="{{ pdf_default_date }}" required
               class="border border-base-200 bg-white px-3 py-2 rounded-default text-sm dark:bg-base-900 dark:border-base-700">
        <button type="submit" class="bg-primary-600 flex items-center gap-2 px-3 py-2 rounded-default text-sm text-white">
            Gerar PDF Consolidado
        </button>
    </form>
{% endblock %}
