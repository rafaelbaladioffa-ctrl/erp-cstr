name: erp-cstr-zabbix

services:
  zabbix-db:
    image: postgres:17-alpine
    container_name: zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
    volumes:
      - zabbix_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 10

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
    ports:
      - "10051:10051"
    depends_on:
      zabbix-db:
        condition: service_healthy
    volumes:
      - zabbix_server_data:/var/lib/zabbix

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8081:8080"
    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started

  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped
    network_mode: host
    environment:
      # Precisa bater exatamente com o "Host name" já criado no Zabbix pelo
      # Discovery (192.168.15.90) — active checks casam pelo nome, não pelo IP.
      ZBX_HOSTNAME: "192.168.15.90"
      # ZBX_ACTIVESERVERS (não ZBX_SERVERACTIVE — nome real usado pelo
      # entrypoint.sh do agente) — pra onde ele EMPURRA os dados —
      # o caminho inverso (server puxando do agente) esbarra num hairpin NAT
      # entre a rede bridge do zabbix-server e a rede host do agente (TCP não
      # volta, mesmo o ICMP funcionando); indo o agente até o server, que já
      # publica a porta 10051 pro host, funciona sem esse problema.
      #
      # ZBX_SERVER_HOST tem um default embutido na imagem ("zabbix-server")
      # que o entrypoint SEMPRE prepend na lista de ZBX_ACTIVESERVERS quando
      # não está vazio — sem sobrescrever aqui também, o agente tentava
      # "zabbix-server" (não resolve fora da rede bridge) antes do 127.0.0.1.
      ZBX_SERVER_HOST: 127.0.0.1
      ZBX_ACTIVESERVERS: 127.0.0.1
    depends_on:
      - zabbix-server

volumes:
  zabbix_db_data:
  zabbix_server_data:
